server {
    if ($host = m.nikulin.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name m.nikulin.dev;

    location /.well-known/acme-challenge/ {
       root /var/www/acme-challenge;
       allow all;
    }

    location / {
      return 301 https://$server_name$request_uri;
    }


}


server {
    listen 443 ssl http2;
    server_name m.nikulin.dev;

    access_log  /var/log/nginx/m.nikulin.dev.access.log;
    error_log /var/log/nginx/m.nikulin.dev.error.log warn;
    ssl_certificate /etc/letsencrypt/live/m.nikulin.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/m.nikulin.dev/privkey.pem; # managed by Certbot
    ssl_dhparam /etc/nginx/ssl/dhparams.pem;

    include include/ssl.conf;
    include include/gzip.conf;

    location = /login {
        limit_req zone=login_limit_v2 burst=5 nodelay;
	limit_req_status 429;
        
        proxy_pass http://127.0.0.1:2053;
	proxy_redirect off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:2053;
        proxy_redirect off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

}
