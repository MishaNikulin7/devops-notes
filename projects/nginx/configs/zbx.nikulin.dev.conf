server {
    listen 80;
    server_name zbx.nikulin.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name zbx.nikulin.dev;

    access_log /var/log/nginx/zbx.nikulin.dev.log;
    error_log /var/log/nginx/zbx.nikulin.dev.error.log;

    ssl_certificate /etc/letsencrypt/live/zbx.nikulin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zbx.nikulin.dev/privkey.pem;
    ssl_dhparam /etc/nginx/ssl/dhparams.pem;

    include include/ssl.conf;
    include include/gzip.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_redirect off;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
